<!DOCTYPE html>
<html lang="en" class="dark overscroll-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Video Generator Studio — OpenArt Suite</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#fb23c2', hover: '#ed00b5', glow: 'rgba(251, 35, 194, 0.35)' },
            ink: { 0: '#090a0a', 1: '#121314', 2: '#16181a', 3: '#1b1d1f', 4: '#242729' },
            accent: { emerald: '#0ae448', lime: '#ccff3e', cyan: '#22d3ee' },
            slate: { 8: '#625f69', 9: '#6f6d78', 11: '#b5b2bc', 12: '#eeedf0' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-ink-0 text-slate-12 antialiased flex flex-col h-screen overflow-hidden">

  <!-- TOP HEADER WITH HUGEICONS -->
  <header class="h-14 border-b border-white/10 px-4 flex items-center justify-between shrink-0 bg-ink-1">
    <div class="flex items-center gap-4">
      <a href="home.html" class="flex items-center gap-2 group">
        <div class="w-7 h-7 rounded-lg bg-white flex items-center justify-center text-ink-0 shadow-md">
          <i class="hgi-stroke hgi-ai-magic text-base text-ink-0"></i>
        </div>
        <span class="font-heading font-extrabold text-white text-base tracking-tight">OpenArt Studio</span>
      </a>
      <span class="text-slate-8">/</span>
      <span class="text-xs font-semibold text-white flex items-center gap-1.5">
        <i class="hgi-stroke hgi-ai-video-01 text-accent-cyan text-sm"></i>
        AI Video Generator (Veo 3 & Kling)
      </span>
    </div>

    <div class="flex items-center gap-3 text-xs font-semibold">
      <a href="home.html" class="text-slate-11 hover:text-white px-2 py-1 flex items-center gap-1">
        <i class="hgi-stroke hgi-home-01 text-xs"></i>
        <span>Dashboard</span>
      </a>
      <a href="create-image.html" class="text-slate-11 hover:text-white px-2 py-1 flex items-center gap-1">
        <i class="hgi-stroke hgi-ai-image-01 text-xs"></i>
        <span>Image Studio</span>
      </a>
      <a href="director.html" class="text-slate-11 hover:text-white px-2 py-1 flex items-center gap-1">
        <i class="hgi-stroke hgi-camera-video text-xs"></i>
        <span>Director Mode</span>
      </a>
      <button onclick="openModal('credits')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-ink-2 border border-white/10 text-white hover:bg-ink-3 transition">
        <i class="hgi-stroke hgi-diamond-01 text-accent-emerald text-sm"></i>
        <span class="credit-balance-display">50 Credits</span>
      </button>
    </div>
  </header>

  <!-- VIDEO WORKSPACE -->
  <div class="flex-1 flex overflow-hidden">
    <!-- LEFT VIDEO PARAMETERS -->
    <aside class="w-80 bg-ink-1 border-r border-white/10 p-5 flex flex-col gap-5 shrink-0 overflow-y-auto custom-scrollbar">
      <div>
        <label class="text-[11px] font-mono text-slate-11 uppercase block mb-1">AI Video Engine</label>
        <button onclick="openModal('model-selector')" class="w-full bg-ink-2 p-2.5 rounded-xl border border-white/10 text-xs font-bold text-white flex justify-between items-center hover:bg-ink-3 transition">
          <span class="flex items-center gap-2">
            <i class="hgi-stroke hgi-clapperboard text-accent-cyan text-sm"></i>
            Google Veo 3 (Cinematic)
          </span>
          <i class="hgi-stroke hgi-arrow-right-01 text-xs text-slate-8"></i>
        </button>
      </div>

      <div>
        <label class="text-[11px] font-mono text-slate-11 uppercase block mb-1">Camera Trajectory</label>
        <button onclick="openModal('camera')" class="w-full bg-accent-cyan/10 hover:bg-accent-cyan/20 border border-accent-cyan/30 text-accent-cyan p-2.5 rounded-xl text-xs font-bold flex items-center justify-between transition">
          <span class="flex items-center gap-2">
            <i class="hgi-stroke hgi-camera-video text-base"></i>
            <span>3D Motion & Pan Control</span>
          </span>
          <i class="hgi-stroke hgi-arrow-right-01 text-xs"></i>
        </button>
      </div>

      <div>
        <label class="text-[11px] font-mono text-slate-11 uppercase block mb-1">Duration & FPS</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button class="py-2 rounded-xl bg-brand/20 border border-brand text-white font-semibold">5s (Standard)</button>
          <button class="py-2 rounded-xl bg-ink-2 border border-white/5 text-slate-11 hover:text-white">10s (Extended)</button>
        </div>
      </div>

      <div>
        <div class="flex justify-between text-[11px] text-slate-11 mb-1 font-mono">
          <span>Motion Dynamic Range</span>
          <span class="text-white">Level 6</span>
        </div>
        <input type="range" min="1" max="10" value="6" class="w-full accent-brand">
        <div class="flex justify-between text-[10px] text-slate-9 mt-1">
          <span>Subtle Drift</span>
          <span>Dynamic Pan</span>
        </div>
      </div>

      <div class="mt-auto p-3 rounded-xl bg-ink-2 border border-white/5 text-xs">
        <span class="text-slate-9 block mb-1">Render Cost:</span>
        <div class="flex justify-between items-center text-white font-bold">
          <span class="flex items-center gap-1.5">
            <i class="hgi-stroke hgi-sparkles text-xs text-brand"></i>
            Veo 3 High-Fidelity
          </span>
          <span class="text-brand">5 Credits</span>
        </div>
      </div>
    </aside>

    <!-- CENTER VIDEO CANVAS -->
    <main class="flex-1 p-6 flex flex-col items-center justify-center overflow-y-auto">
      <div class="w-full max-w-2xl bg-ink-1 border border-white/15 rounded-3xl p-6 flex flex-col items-center text-center shadow-2xl">
        <div class="w-full h-80 bg-black/60 rounded-2xl border border-white/10 flex items-center justify-center relative overflow-hidden mb-4 group">
          <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
            <button onclick="alert('Playing simulated video clip at 24fps...')" class="w-16 h-16 rounded-full bg-brand text-white flex items-center justify-center text-2xl shadow-xl hover:scale-110 transition">
              <i class="hgi-stroke hgi-play text-xl ml-1"></i>
            </button>
          </div>
          <span class="absolute bottom-3 left-3 bg-black/70 px-2.5 py-1 rounded-md text-[10px] font-mono text-white flex items-center gap-1.5">
            <i class="hgi-stroke hgi-clapperboard text-xs text-accent-cyan"></i>
            Veo 3 &bull; 1080p 24fps &bull; 00:05
          </span>
        </div>

        <div class="flex gap-3 w-full">
          <input id="video-prompt-input" type="text" placeholder="Enter video script or prompt..." value="Slow drone orbit around futuristic glass skyscraper at dusk, volumetric reflections" class="flex-1 bg-ink-2 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
          <button onclick="executeStudioGeneration(5)" class="bg-brand hover:bg-brand-hover text-white px-5 py-2.5 rounded-xl font-bold text-xs shrink-0 transition active:scale-95 shadow-lg shadow-brand/20 flex items-center gap-1.5">
            <i class="hgi-stroke hgi-sparkles text-xs"></i>
            <span>Render Video (5 Credits)</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Mandatory Deerflow Signature -->
  <a href="https://deerflow.tech" target="_blank" rel="noopener noreferrer" class="deerflow-signature" title="Created by Deerflow">
    <span class="deerflow-sparkle">✦</span>
    <span>Created By Deerflow</span>
  </a>

  <!-- Modals & Scripts -->
  <script src="js/modals.js"></script>
  <script src="js/studio.js"></script>
</body>
</html>
