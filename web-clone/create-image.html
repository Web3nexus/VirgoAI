<!DOCTYPE html>
<html lang="en" class="dark overscroll-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Image Generator Studio — OpenArt Suite</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#fb23c2', hover: '#ed00b5', glow: 'rgba(251, 35, 194, 0.35)' },
            ink: { 0: '#090a0a', 1: '#121314', 2: '#16181a', 3: '#1b1d1f', 4: '#242729' },
            accent: { emerald: '#0ae448', lime: '#ccff3e', cyan: '#22d3ee' },
            slate: { 8: '#625f69', 9: '#6f6d78', 11: '#b5b2bc', 12: '#eeedf0' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-ink-0 text-slate-12 antialiased flex flex-col h-screen overflow-hidden">

  <!-- TOP HEADER WITH HUGEICONS -->
  <header class="h-14 border-b border-white/10 px-4 flex items-center justify-between shrink-0 bg-ink-1">
    <div class="flex items-center gap-4">
      <a href="home.html" class="flex items-center gap-2 group">
        <div class="w-7 h-7 rounded-lg bg-white flex items-center justify-center text-ink-0 shadow-md">
          <i class="hgi-stroke hgi-ai-magic text-base text-ink-0"></i>
        </div>
        <span class="font-heading font-extrabold text-white text-base tracking-tight">OpenArt Studio</span>
      </a>
      <span class="text-slate-8">/</span>
      <span class="text-xs font-semibold text-white flex items-center gap-1.5">
        <i class="hgi-stroke hgi-ai-image-01 text-brand text-sm"></i>
        AI Image Generator
      </span>
    </div>

    <div class="flex items-center gap-3 text-xs font-semibold">
      <a href="home.html" class="text-slate-11 hover:text-white px-2 py-1 flex items-center gap-1">
        <i class="hgi-stroke hgi-home-01 text-xs"></i>
        <span>Dashboard</span>
      </a>
      <a href="create-video.html" class="text-slate-11 hover:text-white px-2 py-1 flex items-center gap-1">
        <i class="hgi-stroke hgi-ai-video-01 text-xs"></i>
        <span>Video Studio</span>
      </a>
      <a href="director.html" class="text-slate-11 hover:text-white px-2 py-1 flex items-center gap-1">
        <i class="hgi-stroke hgi-camera-video text-xs"></i>
        <span>Director</span>
      </a>
      <button onclick="openModal('credits')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-ink-2 border border-white/10 text-white hover:bg-ink-3 transition">
        <i class="hgi-stroke hgi-diamond-01 text-accent-emerald text-sm"></i>
        <span class="credit-balance-display">50 Credits</span>
      </button>
    </div>
  </header>

  <!-- STUDIO WORKSPACE -->
  <div class="flex-1 flex overflow-hidden">

    <!-- LEFT CONFIGURATION DRAWER -->
    <aside class="w-80 bg-ink-1 border-r border-white/10 p-4 flex flex-col gap-4 overflow-y-auto custom-scrollbar shrink-0">
      <!-- Model Selector -->
      <div>
        <label class="text-[11px] font-semibold text-slate-11 block mb-1.5 uppercase font-mono">Active Model</label>
        <button onclick="openModal('model-selector')" class="w-full bg-ink-2 hover:bg-ink-3 border border-white/10 rounded-xl p-2.5 flex items-center justify-between text-left transition">
          <div class="flex items-center gap-2">
            <i class="hgi-stroke hgi-flash text-brand text-sm"></i>
            <div>
              <span id="active-model-name" class="font-bold text-xs text-white block">Seedream 5.0 (Latest)</span>
              <span class="text-[10px] text-slate-9">Photorealism & Graphic Detail</span>
            </div>
          </div>
          <i class="hgi-stroke hgi-arrow-right-01 text-xs text-slate-8"></i>
        </button>
      </div>

      <!-- Aspect Ratio Selection -->
      <div>
        <label class="text-[11px] font-semibold text-slate-11 block mb-1.5 uppercase font-mono">Aspect Ratio</label>
        <div class="grid grid-cols-5 gap-1.5 text-center text-xs">
          <button onclick="setRatioAction('1:1', this)" class="ratio-btn py-2 rounded-lg bg-brand/20 border border-brand text-white font-semibold">1:1</button>
          <button onclick="setRatioAction('16:9', this)" class="ratio-btn py-2 rounded-lg bg-ink-2 border border-white/5 text-slate-11 hover:text-white">16:9</button>
          <button onclick="setRatioAction('9:16', this)" class="ratio-btn py-2 rounded-lg bg-ink-2 border border-white/5 text-slate-11 hover:text-white">9:16</button>
          <button onclick="setRatioAction('4:3', this)" class="ratio-btn py-2 rounded-lg bg-ink-2 border border-white/5 text-slate-11 hover:text-white">4:3</button>
          <button onclick="setRatioAction('3:4', this)" class="ratio-btn py-2 rounded-lg bg-ink-2 border border-white/5 text-slate-11 hover:text-white">3:4</button>
        </div>
      </div>

      <!-- Style Preset Selector -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-[11px] font-semibold text-slate-11 uppercase font-mono">Style Preset</label>
          <button onclick="openModal('styles')" class="text-[10px] text-brand hover:underline flex items-center gap-1">
            <span>View All</span>
            <i class="hgi-stroke hgi-arrow-right-01 text-[10px]"></i>
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button onclick="setStyleAction('Photorealistic', this)" class="style-chip p-2 rounded-lg bg-brand/20 border border-brand text-white text-left font-medium flex items-center gap-1.5">
            <i class="hgi-stroke hgi-camera-01 text-brand text-sm"></i>
            <span>Cinematic Photo</span>
          </button>
          <button onclick="setStyleAction('Anime', this)" class="style-chip p-2 rounded-lg bg-ink-2 border border-white/5 text-slate-11 hover:text-white text-left flex items-center gap-1.5">
            <i class="hgi-stroke hgi-sparkles text-pink-400 text-sm"></i>
            <span>Anime Makoto</span>
          </button>
          <button onclick="setStyleAction('Cyberpunk', this)" class="style-chip p-2 rounded-lg bg-ink-2 border border-white/5 text-slate-11 hover:text-white text-left flex items-center gap-1.5">
            <i class="hgi-stroke hgi-flash text-accent-cyan text-sm"></i>
            <span>Cyberpunk 2077</span>
          </button>
          <button onclick="setStyleAction('3D Render', this)" class="style-chip p-2 rounded-lg bg-ink-2 border border-white/5 text-slate-11 hover:text-white text-left flex items-center gap-1.5">
            <i class="hgi-stroke hgi-cube text-blue-400 text-sm"></i>
            <span>3D Pixar</span>
          </button>
        </div>
      </div>

      <!-- Advanced Accordion -->
      <details class="bg-ink-2 border border-white/5 rounded-xl p-3 text-xs">
        <summary class="font-semibold text-slate-11 cursor-pointer flex justify-between items-center">
          <span class="flex items-center gap-1.5">
            <i class="hgi-stroke hgi-sliders-horizontal text-xs text-brand"></i>
            Advanced Tuning
          </span>
          <i class="hgi-stroke hgi-arrow-down-01 text-xs text-slate-8"></i>
        </summary>
        <div class="space-y-3 pt-3">
          <div>
            <div class="flex justify-between text-[11px] text-slate-11 mb-1">
              <span>CFG Scale</span>
              <span id="cfg-val" class="font-mono text-white">7.0</span>
            </div>
            <input type="range" min="1" max="20" step="0.5" value="7" oninput="document.getElementById('cfg-val').innerText = this.value" class="w-full accent-brand">
          </div>
          <div>
            <label class="text-[11px] text-slate-11 block mb-1">Negative Prompt</label>
            <input type="text" placeholder="blurry, distorted, artifacts..." class="w-full bg-ink-1 border border-white/10 rounded-lg p-2 text-xs text-white outline-none">
          </div>
        </div>
      </details>
    </aside>

    <!-- CENTER & RIGHT: GENERATION STAGE -->
    <main class="flex-1 flex flex-col p-6 overflow-y-auto custom-scrollbar">
      <!-- Prompt Container -->
      <div class="bg-ink-1 border border-white/15 rounded-2xl p-4 shadow-xl mb-6">
        <textarea id="studio-prompt-input" rows="3" placeholder="Describe your image in rich sensory detail..." class="w-full bg-transparent outline-none text-white text-sm placeholder-slate-9 resize-none font-sans p-1">Golden hour portrait of a cybernetic geisha with delicate porcelain skin, fiber-optic embroidery kimono, soft bokeh, 8k resolution, octane render</textarea>
        
        <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-white/10">
          <div class="flex items-center gap-2">
            <button onclick="enhanceStudioPrompt()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand/10 hover:bg-brand/20 text-brand text-xs font-semibold border border-brand/20 transition">
              <i class="hgi-stroke hgi-ai-magic text-xs"></i>
              <span>Magic Wand</span>
            </button>
            <button onclick="document.getElementById('studio-prompt-input').value=''" class="px-2.5 py-1.5 text-slate-9 hover:text-white text-xs transition">Clear</button>
          </div>

          <button onclick="executeStudioGeneration(1)" class="bg-brand hover:bg-brand-hover text-white px-6 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 transition shadow-lg shadow-brand/25 active:scale-95">
            <i class="hgi-stroke hgi-sparkles text-xs"></i>
            <span>Generate Image</span>
            <span class="bg-black/30 px-2 py-0.5 rounded text-[10px] font-mono">1 Credit</span>
          </button>
        </div>
      </div>

      <!-- Live Generation Progress Card -->
      <div id="generation-progress-card" class="hidden mb-6 p-4 rounded-2xl bg-ink-1 border border-brand/40 shadow-lg animate-pulse">
        <div class="flex items-center justify-between text-xs font-semibold text-white mb-2">
          <span class="flex items-center gap-2">
            <i class="hgi-stroke hgi-sparkles text-brand text-sm animate-spin"></i>
            Generating latent diffusion image canvas...
          </span>
          <span id="gen-percent" class="font-mono text-brand">35%</span>
        </div>
        <div class="w-full h-2 rounded-full bg-ink-3 overflow-hidden">
          <div id="gen-bar" class="h-full bg-gradient-to-r from-brand to-accent-emerald rounded-full transition-all duration-300 w-1/3"></div>
        </div>
      </div>

      <!-- Generations Gallery Grid -->
      <div class="flex-1">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-heading font-bold text-base text-white">Generated Creations</h3>
          <span class="text-xs text-slate-9">Click any creation to inspect or remix</span>
        </div>

        <div id="creations-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
          <div onclick="openModal('image-detail')" class="group relative rounded-2xl overflow-hidden bg-ink-1 border border-white/10 aspect-square cursor-pointer">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition p-3 flex flex-col justify-end">
              <span class="text-xs font-bold text-white truncate">Cyber Geisha Portrait</span>
              <div class="flex items-center gap-1.5 mt-1">
                <span class="text-[10px] px-2 py-0.5 rounded bg-brand/30 text-brand font-medium">Remix</span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-white/20 text-white font-medium" onclick="event.stopPropagation(); openModal('upscale')">Topaz 4x</span>
              </div>
            </div>
          </div>

          <div onclick="openModal('image-detail')" class="group relative rounded-2xl overflow-hidden bg-ink-1 border border-white/10 aspect-square cursor-pointer">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition p-3 flex flex-col justify-end">
              <span class="text-xs font-bold text-white truncate">Neon Liquid Flow</span>
              <div class="flex items-center gap-1.5 mt-1">
                <span class="text-[10px] px-2 py-0.5 rounded bg-brand/30 text-brand font-medium">Remix</span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-white/20 text-white font-medium" onclick="event.stopPropagation(); openModal('upscale')">Topaz 4x</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Mandatory Deerflow Signature -->
  <a href="https://deerflow.tech" target="_blank" rel="noopener noreferrer" class="deerflow-signature" title="Created by Deerflow">
    <span class="deerflow-sparkle">✦</span>
    <span>Created By Deerflow</span>
  </a>

  <!-- Modals & Scripts -->
  <script src="js/modals.js"></script>
  <script src="js/studio.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const p = params.get('prompt');
    if (p) {
      document.getElementById('studio-prompt-input').value = decodeURIComponent(p);
    }
  </script>
</body>
</html>
