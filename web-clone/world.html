<!DOCTYPE html>
<html lang="en" class="dark overscroll-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>3D World Spatial Studio — OpenArt Suite</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#fb23c2', hover: '#ed00b5', glow: 'rgba(251, 35, 194, 0.35)' },
            ink: { 0: '#090a0a', 1: '#121314', 2: '#16181a', 3: '#1b1d1f', 4: '#242729' },
            accent: { emerald: '#0ae448', lime: '#ccff3e', cyan: '#22d3ee' },
            slate: { 8: '#625f69', 9: '#6f6d78', 11: '#b5b2bc', 12: '#eeedf0' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-ink-0 text-slate-12 antialiased flex flex-col h-screen overflow-hidden">

  <!-- TOP HEADER WITH HUGEICONS -->
  <header class="h-14 border-b border-white/10 px-4 flex items-center justify-between shrink-0 bg-ink-1">
    <div class="flex items-center gap-4">
      <a href="home.html" class="flex items-center gap-2 group">
        <div class="w-7 h-7 rounded-lg bg-white flex items-center justify-center text-ink-0 shadow-md">
          <i class="hgi-stroke hgi-ai-magic text-base text-ink-0"></i>
        </div>
        <span class="font-heading font-extrabold text-white text-base tracking-tight">OpenArt 3D World</span>
      </a>
      <span class="text-slate-8">/</span>
      <span class="text-xs font-semibold text-white flex items-center gap-1.5">
        <i class="hgi-stroke hgi-globe-02 text-indigo-400 text-sm"></i>
        Spatial Depth & Parallax
      </span>
    </div>

    <div class="flex items-center gap-3 text-xs font-semibold">
      <a href="home.html" class="text-slate-11 hover:text-white px-2 py-1 flex items-center gap-1">
        <i class="hgi-stroke hgi-home-01 text-xs"></i>
        <span>Dashboard</span>
      </a>
      <a href="create-video.html" class="text-slate-11 hover:text-white px-2 py-1 flex items-center gap-1">
        <i class="hgi-stroke hgi-ai-video-01 text-xs"></i>
        <span>Video Studio</span>
      </a>
      <button onclick="openModal('credits')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-ink-2 border border-white/10 text-white hover:bg-ink-3 transition">
        <i class="hgi-stroke hgi-diamond-01 text-accent-emerald text-sm"></i>
        <span class="credit-balance-display">50 Credits</span>
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto custom-scrollbar p-6 max-w-6xl mx-auto w-full flex flex-col items-center justify-center">
    <div class="text-center mb-6">
      <h1 class="font-heading font-extrabold text-3xl text-white mb-2">Turn Any 2D Image into a Navigable 3D Environment</h1>
      <p class="text-xs text-slate-11 max-w-lg mx-auto">Generate neural depth fields, volumetric point clouds, and immersive parallax camera swoops</p>
    </div>

    <div class="w-full max-w-3xl bg-ink-1 border border-white/15 rounded-3xl p-6 shadow-2xl relative">
      <div id="spatial-canvas" class="w-full h-96 rounded-2xl bg-black overflow-hidden relative border border-white/10 cursor-move" onmousemove="handleParallax(event)">
        <img id="spatial-bg-img" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80" class="w-full h-full object-cover scale-110 transition-transform duration-75">
        <div class="absolute bottom-4 left-4 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-xl text-[10px] font-mono text-white flex items-center gap-2">
          <i class="hgi-stroke hgi-cube text-accent-cyan text-xs"></i>
          <span>Interactive Depth Mesh: Move mouse to orbit 3D view</span>
        </div>
      </div>

      <div class="flex gap-3 mt-4">
        <input type="text" placeholder="Prompt for 3D spatial world..." value="Ancient cyber ruins overgrown with glowing bioluminescent vines, volumetric sunlight shafts" class="flex-1 bg-ink-2 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
        <button onclick="alert('Synthesizing 3D Gaussian Splat mesh...');" class="bg-brand hover:bg-brand-hover text-white px-5 py-2.5 rounded-xl font-bold text-xs shrink-0 transition flex items-center gap-1.5 shadow-lg shadow-brand/20">
          <i class="hgi-stroke hgi-sparkles text-xs"></i>
          <span>Synthesize 3D World</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Mandatory Deerflow Signature -->
  <a href="https://deerflow.tech" target="_blank" rel="noopener noreferrer" class="deerflow-signature" title="Created by Deerflow">
    <span class="deerflow-sparkle">✦</span>
    <span>Created By Deerflow</span>
  </a>

  <!-- Modals & Scripts -->
  <script src="js/modals.js"></script>
  <script>
    function handleParallax(e) {
      const img = document.getElementById('spatial-bg-img');
      const rect = e.currentTarget.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      img.style.transform = `scale(1.15) translate(${x * -25}px, ${y * -25}px) rotateY(${x * 12}deg) rotateX(${y * -12}deg)`;
    }
  </script>
</body>
</html>
